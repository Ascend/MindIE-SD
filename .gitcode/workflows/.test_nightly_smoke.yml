name: Test_nightly_smoke

on:
  workflow_dispatch:
    inputs:
      image_label:
        required: true
        type: string
        description: "Full image reference under test (e.g. swr.cn-north-4.myhuaweicloud.com/atlas-ci/ascend_mindie_sd:gitcode-action-test-latest)"
      testcase_config_file:
        required: false
        type: string
        default: "resources/pytest_mindie_sd.ini"
        description: "pytest-infra testcase config ini (path inside the AscendTest/pytest-infra repo)"
      platform:
        required: false
        type: string
        default: ""
        description: "Hardware platform chosen by the scheduler (passed through to main.py --platform; empty means unspecified)"
      env_deploy_model:
        required: false
        type: string
        default: "Dislocated"
        description: "Test environment deployment mode (passed through to main.py --env_deploy_model)"
  workflow_call:
    inputs:
      testcase_config_file:
        required: false
        type: string
        default: "resources/pytest_mindie_sd.ini"
        description: "pytest-infra testcase config ini (path inside the AscendTest/pytest-infra repo)"
      image_label:
        required: true
        type: string
        description: "Full reference of the nightly image built and pushed by stage_0"
      platform:
        required: false
        type: string
        default: ""
        description: "Hardware platform chosen by the scheduler (passed through to main.py --platform; empty means unspecified)"
      env_deploy_model:
        required: false
        type: string
        default: "Dislocated"
        description: "Test environment deployment mode (passed through to main.py --env_deploy_model)"

permissions:
  repository: read
  id-token: write

jobs:
  JOB_test_nightly:
    name: Test_nightly_smoke
    select: selected_by_default
    runs-on: [ self-hosted, arch=x86, k8s=public ]
    outputs:
      testcase-obs-url: ${{ steps.run-nightly-smoke.outputs.testcase-obs-url }}
      env-log-file: ${{ steps.run-nightly-smoke.outputs.env-log-file }}
      testcase-file: ${{ steps.run-nightly-smoke.outputs.testcase-file }}
      case-logs: ${{ steps.run-nightly-smoke.outputs.case-logs }}
      case-env-log: ${{ steps.run-nightly-smoke.outputs.case-env-log }}
      case-logs-fail: ${{ steps.run-nightly-smoke.outputs.case-logs-fail }}
      case-env-log-fail: ${{ steps.run-nightly-smoke.outputs.case-env-log-fail }}
    steps:
      - name: check trigger inputs
        env:
          IMAGE_LABEL_INPUTS: ${{ inputs.image_label }}
          IMAGE_LABEL_EVENT: ${{ github.event.inputs.image_label }}
          TESTCASE_CONFIG_INPUTS: ${{ inputs.testcase_config_file }}
          PLATFORM_INPUTS: ${{ inputs.platform }}
          ENV_DEPLOY_MODEL_INPUTS: ${{ inputs.env_deploy_model }}
        run: |
          set -eu
          echo "inputs.image_label=[${IMAGE_LABEL_INPUTS}]"
          echo "github.event.inputs.image_label=[${IMAGE_LABEL_EVENT}]"
          echo "inputs.testcase_config_file=[${TESTCASE_CONFIG_INPUTS}]"
          echo "inputs.platform=[${PLATFORM_INPUTS}] inputs.env_deploy_model=[${ENV_DEPLOY_MODEL_INPUTS}]"
          case "${IMAGE_LABEL_INPUTS}" in
            ""|"true")
              echo "ERROR: inputs.image_label 为空，拒绝启动（否则 executor 会退化为全量收集）" >&2
              exit 1
              ;;
          esac
          # An empty testcase config makes the executor fall back to pytest-infra's own pytest.ini and collect the whole repo
          case "${TESTCASE_CONFIG_INPUTS}" in
            ""|"true")
              echo "ERROR: inputs.testcase_config_file 为空，应为 resources/pytest_mindie_sd.ini" >&2
              exit 1
              ;;
          esac

      - name: prepare system pip
        continue-on-error: true
        run: |
          set -x
          PIP_INDEX="-i https://mirrors.huaweicloud.com/repository/pypi/simple"
          python3 -m pip --version
          python3 -m pip install --upgrade --ignore-installed --break-system-packages pip ${PIP_INDEX} \
            || python3 -m pip install --upgrade --ignore-installed pip ${PIP_INDEX} \
            || sudo -n python3 -m pip install --upgrade --ignore-installed --break-system-packages pip ${PIP_INDEX} \
            || echo "WARN: prepare system pip 未成功，继续使用现有 pip"
          python3 -m pip --version
          pip3 --version

      - name: run nightly smoke test
        id: run-nightly-smoke
        uses: openlibing/test-action/pytest-orch@v1.0.10
        continue-on-error: true
        with:
          testcase-config-file: ${{ inputs.testcase_config_file }}
          scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}
          testcase-repo: AscendTest/pytest-infra
          testcase-branch: main
          image-label: ${{ inputs.image_label }}
          archive-log-dir: /tmp/pytest-orch/workspace/nightly-artifacts

      - name: Upload all testcase execution logs
        id: upload-case-logs
        identifier: upload-case-logs
        if: ${{ steps.run-nightly-smoke.outputs.case-logs != '' }}
        uses: upload-artifact
        continue-on-error: true
        with:
          name: all-testcase-execution-logs
          path: ${{ steps.run-nightly-smoke.outputs.case-logs }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload all testcase environment logs
        id: upload-case-env-log
        identifier: upload-case-env-log
        if: ${{ steps.run-nightly-smoke.outputs.case-env-log != '' }}
        uses: upload-artifact
        continue-on-error: true
        with:
          name: all-testcase-environment-logs
          path: ${{ steps.run-nightly-smoke.outputs.case-env-log }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload all failed testcase execution logs
        id: upload-case-logs-fail
        identifier: upload-case-logs-fail
        if: ${{ steps.run-nightly-smoke.outputs.case-logs-fail != '' }}
        uses: upload-artifact
        continue-on-error: true
        with:
          name: all-failed-testcase-execution-logs
          path: ${{ steps.run-nightly-smoke.outputs.case-logs-fail }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload all failed testcase environment logs
        id: upload-case-env-log-fail
        identifier: upload-case-env-log-fail
        if: ${{ steps.run-nightly-smoke.outputs.case-env-log-fail != '' }}
        uses: upload-artifact
        continue-on-error: true
        with:
          name: all-failed-testcase-environment-logs
          path: ${{ steps.run-nightly-smoke.outputs.case-env-log-fail }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: cleanup case-logs dirs
        continue-on-error: true
        env:
          CASE_LOGS: ${{ steps.run-nightly-smoke.outputs.case-logs }}
          CASE_ENV_LOG: ${{ steps.run-nightly-smoke.outputs.case-env-log }}
          CASE_LOGS_FAIL: ${{ steps.run-nightly-smoke.outputs.case-logs-fail }}
          CASE_ENV_LOG_FAIL: ${{ steps.run-nightly-smoke.outputs.case-env-log-fail }}
        run: |
          for d in "$CASE_LOGS" "$CASE_ENV_LOG" "$CASE_LOGS_FAIL" "$CASE_ENV_LOG_FAIL"; do
            if [ -n "$d" ]; then
              echo "removing: $d"
              rm -rf "$d" || true
            fi
          done
